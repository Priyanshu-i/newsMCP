services:
  - type: web
    name: upsc-pdf-annotator-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FILE_TTL_SECONDS
        value: "86400"
      - key: MAX_PDF_BYTES
        value: "52428800"